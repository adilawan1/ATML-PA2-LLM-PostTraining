base_config: configs/base.yaml
updates: 20
fork_updates: 8
prompts_per_update: 1
policy_epochs: 1
learning_rate: 5.0e-6
clip_epsilon: 0.20
kl_beta: 0.10
num_generations: 4
group_sizes: [2, 4, 8]
max_prompt_length: 256
max_completion_length: 512
mask_truncated_completions: true
max_grad_norm: 1.0
output: outputs/task3_grpo/standard
results_dir: results/task3_grpo
group_cache: cached/grpo_k_cache.jsonl
cache_generation_cap: 768

# Student additions (operational only; released constants above are unchanged).
eval_max_response_length: 768   # held-out generation cap, same frozen-evaluation cap as configs/ppo.yaml
eval_batch_size: 16
eval_logprob_chunk: 2
grad_diagnostics: true          # per-completion policy-gradient norms for the length-normalization study
# logprob_temperature defaults to generation.temperature (TRL GRPO convention).
